<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="248" viewBox="0 0 1040 248" role="img" aria-labelledby="title desc">
  <title id="title">From a saved query to a refreshed sheet</title>
  <desc id="desc">Write SQL, run it read-only on BigQuery, keep the query, send the rows, and replace a Google Sheet on a schedule.</desc>
  <rect width="1040" height="248" rx="16" fill="#f3f5f9"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <g>
      <rect x="20" y="28" width="176" height="164" rx="12" fill="#ffffff" stroke="#e2e6ee"/>
      <circle cx="44" cy="56" r="12" fill="#e7eeff"/>
      <text x="44" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#2f62f0">1</text>
      <text x="36" y="92" font-size="16" font-weight="600" fill="#1b2430">Write</text>
      <text x="36" y="118" font-size="12" fill="#5e6a7d">SELECT or WITH</text>
      <text x="36" y="136" font-size="12" fill="#5e6a7d">Suggestions from</text>
      <text x="36" y="154" font-size="12" fill="#5e6a7d">your data marts</text>
    </g>
    <path d="M204 110h20M216 104l8 6-8 6" fill="none" stroke="#2f62f0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="232" y="28" width="176" height="164" rx="12" fill="#ffffff" stroke="#e2e6ee"/>
      <circle cx="256" cy="56" r="12" fill="#e7eeff"/>
      <text x="256" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#2f62f0">2</text>
      <text x="248" y="92" font-size="16" font-weight="600" fill="#1b2430">Run</text>
      <text x="248" y="118" font-size="12" fill="#5e6a7d">Read-only BigQuery</text>
      <text x="248" y="136" font-size="12" fill="#5e6a7d">One service account</text>
      <text x="248" y="154" font-size="12" fill="#5e6a7d">Pages of rows</text>
    </g>
    <path d="M416 110h20M428 104l8 6-8 6" fill="none" stroke="#2f62f0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="444" y="28" width="176" height="164" rx="12" fill="#ffffff" stroke="#e2e6ee"/>
      <circle cx="468" cy="56" r="12" fill="#e7eeff"/>
      <text x="468" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#2f62f0">3</text>
      <text x="460" y="92" font-size="16" font-weight="600" fill="#1b2430">Keep</text>
      <text x="460" y="118" font-size="12" fill="#5e6a7d">Saved queries</text>
      <text x="460" y="136" font-size="12" fill="#5e6a7d">Compare versions</text>
      <text x="460" y="154" font-size="12" fill="#5e6a7d">Markdown notes</text>
    </g>
    <path d="M628 110h20M640 104l8 6-8 6" fill="none" stroke="#2f62f0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="656" y="28" width="176" height="164" rx="12" fill="#ffffff" stroke="#e2e6ee"/>
      <circle cx="680" cy="56" r="12" fill="#e7eeff"/>
      <text x="680" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#2f62f0">4</text>
      <text x="672" y="92" font-size="16" font-weight="600" fill="#1b2430">Send</text>
      <text x="672" y="118" font-size="12" fill="#5e6a7d">Sheet, Doc, or CSV</text>
      <text x="672" y="136" font-size="12" fill="#5e6a7d">This page or all rows</text>
      <text x="672" y="154" font-size="12" fill="#5e6a7d">New SQL data mart</text>
    </g>
    <path d="M840 110h20M852 104l8 6-8 6" fill="none" stroke="#2f62f0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="868" y="28" width="152" height="164" rx="12" fill="#2f62f0"/>
      <circle cx="892" cy="56" r="12" fill="#ffffff"/>
      <text x="892" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#2f62f0">5</text>
      <text x="884" y="92" font-size="16" font-weight="600" fill="#ffffff">Repeat</text>
      <text x="884" y="118" font-size="12" fill="#d7e2ff">Daily or weekly</text>
      <text x="884" y="136" font-size="12" fill="#d7e2ff">Same sheet tab</text>
      <text x="884" y="154" font-size="12" fill="#d7e2ff">While you are away</text>
    </g>
    <text x="520" y="222" text-anchor="middle" font-size="12" fill="#5e6a7d">Check the rows, then send them. Create an OWOX report only when this query should stay.</text>
  </g>
</svg>
